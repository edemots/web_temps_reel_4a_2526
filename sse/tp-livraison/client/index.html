<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Suivi live d’une livraison</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        background: #f7f7fb;
        color: #222;
        padding: 0 20px;
      }
      .card {
        background: white;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        margin-bottom: 20px;
      }
      .bar {
        width: 100%;
        height: 20px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 10px;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        background: #22c55e;
        transition: width 0.3s ease;
      }
      .event {
        padding: 12px;
        border-radius: 10px;
        background: #eef2ff;
        margin-bottom: 10px;
      }
    </style>

    <script src="index.js" defer></script>
  </head>
  <body>
    <h1>Suivi live d’une livraison</h1>
    <div class="card">
      <h2 id="item">Chargement...</h2>
      <p><strong>Livreur :</strong> <span id="courier"></span></p>
      <p><strong>Statut :</strong> <span id="status"></span></p>
      <p><strong>ETA :</strong> <span id="eta"></span></p>
      <p><strong>Progression :</strong> <span id="progress-text"></span>%</p>
      <div class="bar">
        <div class="bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="card">
      <h2>Historique</h2>
      <div id="events"></div>
    </div>
  </body>
</html>
